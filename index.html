<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Лава Яша — Дурак</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #087a3d;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .game {
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            margin: 5px 0;
            font-size: 25px;
        }

        .info {
            font-size: 14px;
            opacity: .9;
        }

        .table {
            position: relative;
            min-height: 390px;
            flex: 1;
        }

        .enemy {
            text-align: center;
            margin-top: 10px;
        }

        .enemy-name {
            font-weight: bold;
        }

        .enemy-cards {
            display: flex;
            justify-content: center;
            margin-top: 8px;
            height: 48px;
        }

        .enemy-card {
            width: 32px;
            height: 45px;
            background: #174a9c;
            border: 2px solid white;
            border-radius: 5px;
            margin-left: -9px;
        }

        .enemy-card:first-child {
            margin-left: 0;
        }

        .deck {
            position: absolute;
            left: 20px;
            top: 130px;
            text-align: center;
        }

        .deck-card {
            width: 55px;
            height: 78px;
            border-radius: 8px;
            background: #174a9c;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .deck-count {
            margin-top: 5px;
            font-size: 13px;
        }

        .trump {
            position: absolute;
            left: 85px;
            top: 150px;
            font-size: 25px;
        }

        .battle {
            position: absolute;
            left: 50%;
            top: 115px;
            transform: translateX(-50%);
            width: 180px;
            min-height: 150px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            justify-items: center;
            align-items: center;
        }

        .battle-card {
            width: 58px;
            height: 84px;
            background: white;
            color: black;
            border-radius: 8px;
            border: 2px solid #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,.3);
        }

        .red {
            color: #d00000;
        }

        .black {
            color: #111;
        }

        .message {
            text-align: center;
            min-height: 42px;
            font-size: 15px;
            padding: 5px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        button {
            border: none;
            border-radius: 11px;
            padding: 11px 17px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .take {
            background: #e53935;
        }

        .pass {
            background: #1976d2;
        }

        .new-game {
            background: #ff9800;
            margin: 5px auto 8px;
        }

        .hand-title {
            text-align: center;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .hand {
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 5px;
        }

        .card {
            width: 52px;
            height: 78px;
            background: white;
            color: black;
            border-radius: 8px;
            border: 2px solid #ddd;
            margin-left: -8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,.35);
            cursor: pointer;
            transition: .15s;
        }

        .card:first-child {
            margin-left: 0;
        }

        .card:hover {
            transform: translateY(-12px);
        }

        .card.selected {
            transform: translateY(-15px);
            border: 3px solid #ffd600;
        }

        @media (max-width: 390px) {
            .card {
                width: 46px;
                height: 70px;
                font-size: 15px;
            }

            .battle {
                width: 150px;
            }
        }
    </style>
</head>

<body>

<div class="game">

    <div class="header">
        <h1>🔥 Лава Яша — Дурак</h1>
        <div class="info">
            Колода: <span id="deckCount">24</span> карт
        </div>
    </div>

    <div class="table">

        <div class="enemy">
            <div class="enemy-name">🤖 Лава Яша</div>
            <div class="enemy-cards" id="enemyCards"></div>
        </div>

        <div class="deck">
            <div class="deck-card">🂠</div>
            <div class="deck-count" id="deckCount2">24</div>
        </div>

        <div class="trump" id="trump">♠</div>

        <div class="battle" id="battle"></div>

    </div>

    <div class="message" id="message">
        Загружаем игру...
    </div>

    <div class="actions">
        <button class="take" id="takeButton" onclick="takeCards()" style="display:none">
            Взять
        </button>

        <button class="pass" id="passButton" onclick="finishAttack()" style="display:none">
            Бито
        </button>
    </div>

    <div class="hand-title">
        👤 Твои карты
    </div>

    <div class="hand" id="playerHand"></div>

    <button class="new-game" onclick="newGame()">
        🔄 Новая игра
    </button>

</div>

<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const suits = [
        {
            symbol: "♠",
            name: "spades",
            color: "black"
        },
        {
            symbol: "♥",
            name: "hearts",
            color: "red"
        },
        {
            symbol: "♦",
            name: "diamonds",
            color: "red"
        },
        {
            symbol: "♣",
            name: "clubs",
            color: "black"
        }
    ];

    const ranks = [
        { name: "6", value: 6 },
        { name: "7", value: 7 },
        { name: "8", value: 8 },
        { name: "9", value: 9 },
        { name: "10", value: 10 },
        { name: "J", value: 11 },
        { name: "Q", value: 12 },
        { name: "K", value: 13 },
        { name: "A", value: 14 }
    ];

    let deck = [];
    let playerHand = [];
    let enemyHand = [];

    let trumpSuit = null;

    let table = [];

    let attacking = true;

    let gameOver = false;


    function createDeck() {

        deck = [];

        for (const suit of suits) {

            for (const rank of ranks) {

                deck.push({
                    suit: suit.name,
                    symbol: suit.symbol,
                    color: suit.color,
                    rank: rank.name,
                    value: rank.value
                });

            }

        }

        deck.sort(() => Math.random() - 0.5);
    }


    function dealCards() {

        playerHand = [];
        enemyHand = [];
        table = [];

        for (let i = 0; i < 6; i++) {

            playerHand.push(deck.pop());
            enemyHand.push(deck.pop());

        }

        trumpSuit = deck[deck.length - 1].suit;

        attacking = true;

        gameOver = false;

        render();

        setMessage("Твой ход. Выбери карту.");
    }


    function getSuit(card) {

        return card.suit;
    }


    function canBeat(attack, defense) {

        const attackTrump = attack.suit === trumpSuit;
        const defenseTrump = defense.suit === trumpSuit;

        if (attack.suit === defense.suit) {

            return defense.value > attack.value;

        }

        if (!attackTrump && defenseTrump) {

            return true;

        }

        return false;
    }


    function playCard(index) {

        if (gameOver) {
            return;
        }

        const card = playerHand[index];

        if (attacking) {

            playerHand.splice(index, 1);

            table.push({
                attack: card,
                defense: null
            });

            attacking = false;

            render();

            setMessage(
                "Ты сходил " +
                card.rank +
                card.symbol +
                ". Лава Яша отбивается..."
            );

            setTimeout(enemyDefense, 700);

        } else {

            const last = table[table.length - 1];

            if (!last || last.defense !== null) {

                setMessage("Сейчас нельзя подкинуть эту карту.");

                return;
            }

            if (!canBeat(last.attack, card)) {

                setMessage("Этой картой нельзя отбиться!");

                return;
            }

            playerHand.splice(index, 1);

            last.defense = card;

            render();

            setMessage("Ты отбился. Лава Яша атакует...");

            setTimeout(enemyAttack, 700);
        }
    }


    function enemyDefense() {

        if (table.length === 0) {
            return;
        }

        const pair = table[table.length - 1];

        let possible = enemyHand.filter(card =>
            canBeat(pair.attack, card)
        );

        if (possible.length === 0) {

            setMessage(
                "Лава Яша не смог отбиться и забирает карты!"
            );

            setTimeout(enemyTake, 700);

            return;
        }

        possible.sort((a, b) => a.value - b.value);

        const chosen = possible[0];

        const index = enemyHand.indexOf(chosen);

        enemyHand.splice(index, 1);

        pair.defense = chosen;

        render();

        setMessage(
            "Лава Яша отбился " +
            chosen.rank +
            chosen.symbol
        );

        setTimeout(() => {

            attacking = true;

            table = [];

            drawCards();

            render();

            checkWinner();

            if (!gameOver) {
                setMessage("Твой ход.");
            }

        }, 900);
    }


    function enemyTake() {

        for (const pair of table) {

            enemyHand.push(pair.attack);

            if (pair.defense) {
                enemyHand.push(pair.defense);
            }

        }

        table = [];

        drawCards();

        render();

        checkWinner();

        if (!gameOver) {

            setMessage(
                "Лава Яша забрал карты. Теперь твой ход."
            );

            attacking = true;
        }
    }


    function enemyAttack() {

        if (gameOver) {
            return;
        }

        if (enemyHand.length === 0) {

            checkWinner();

            return;
        }

        let possible = enemyHand.filter(card => {

            return table.some(pair =>
                pair.attack.rank === card.rank ||
                (pair.defense && pair.defense.rank === card.rank)
            );

        });

        if (possible.length === 0) {

            table = [];

            drawCards();

            render();

            attacking = true;

            checkWinner();

            if (!gameOver) {
                setMessage("Лава Яша пропустил. Твой ход.");
            }

            return;
        }

        const card = possible[0];

        const index = enemyHand.indexOf(card);

        enemyHand.splice(index, 1);

        table.push({
            attack: card,
            defense: null
        });

        attacking = false;

        render();

        setMessage(
            "Лава Яша подкинул " +
            card.rank +
            card.symbol
        );

        setTimeout(() => {

            setMessage("Твой ход — отбивайся!");

        }, 500);
    }


    function takeCards() {

        for (const pair of table) {

            playerHand.push(pair.attack);

            if (pair.defense) {
                playerHand.push(pair.defense);
            }

        }

        table = [];

        drawCards();

        attacking = true;

        render();

        setMessage("Ты взял карты. Теперь ход Лавы Яши.");

        setTimeout(enemyAttack, 800);
    }


    function finishAttack() {

        if (table.length === 0) {
            return;
        }

        const unfinished = table.some(
            pair => pair.defense === null
        );

        if (unfinished) {

            setMessage("Сначала отбей все карты!");

            return;
        }

        table = [];

        drawCards();

        render();

        checkWinner();

        if (!gameOver) {

            attacking = true;

            setMessage("Карты биты. Твой ход.");
        }
    }


    function drawCards() {

        while (
            playerHand.length < 6 &&
            deck.length > 0
        ) {

            playerHand.push(deck.pop());

        }

        while (
            enemyHand.length < 6 &&
            deck.length > 0
        ) {

            enemyHand.push(deck.pop());

        }
    }


    function checkWinner() {

        if (
            playerHand.length === 0 &&
            deck.length === 0
        ) {

            gameOver = true;

            setMessage("🏆 Ты победил!");

            return;
        }

        if (
            enemyHand.length === 0 &&
            deck.length === 0
        ) {

            gameOver = true;

            setMessage("🤖 Лава Яша победил!");

        }
    }


    function setMessage(text) {

        document.getElementById("message").innerText = text;
    }


    function render() {

        const playerElement =
            document.getElementById("playerHand");

        const enemyElement =
            document.getElementById("enemyCards");

        const battleElement =
            document.getElementById("battle");

        playerElement.innerHTML = "";

        enemyElement.innerHTML = "";

        battleElement.innerHTML = "";


        playerHand.forEach((card, index) => {

            const element =
                document.createElement("div");

            element.className =
                "card " + card.color;

            element.innerHTML = `
                <div>${card.rank}</div>
                <div>${card.symbol}</div>
            `;

            element.onclick = () =>
                playCard(index);

            playerElement.appendChild(element);

        });


        enemyHand.forEach(() => {

            const element =
                document.createElement("div");

            element.className =
                "enemy-card";

            enemyElement.appendChild(element);

        });


        table.forEach(pair => {

            const attack =
                document.createElement("div");

            attack.className =
                "battle-card " +
                pair.attack.color;

            attack.innerHTML = `
                <div>${pair.attack.rank}</div>
                <div>${pair.attack.symbol}</div>
            `;

            battleElement.appendChild(attack);


            if (pair.defense) {

                const defense =
                    document.createElement("div");

                defense.className =
                    "battle-card " +
                    pair.defense.color;

                defense.innerHTML = `
                    <div>${pair.defense.rank}</div>
                    <div>${pair.defense.symbol}</div>
                `;

                battleElement.appendChild(defense);

            } else {

                const empty =
                    document.createElement("div");

                battleElement.appendChild(empty);

            }

        });


        const trump =
            suits.find(
                suit => suit.name === trumpSuit
            );

        document.getElementById("trump").innerText =
            "Козырь: " + trump.symbol;


        document.getElementById("deckCount").innerText =
            deck.length;

        document.getElementById("deckCount2").innerText =
            deck.length;


        const takeButton =
            document.getElementById("takeButton");

        const passButton =
            document.getElementById("passButton");


        const unfinished =
            table.some(
                pair => pair.defense === null
            );


        if (!attacking && table.length > 0) {

            takeButton.style.display = "block";

        } else {

            takeButton.style.display = "none";

        }


        if (
            table.length > 0 &&
            !unfinished
        ) {

            passButton.style.display = "block";

        } else {

            passButton.style.display = "none";

        }

    }


    function newGame() {

        createDeck();

        dealCards();

    }


    newGame();

</script>

</body>
</html>
