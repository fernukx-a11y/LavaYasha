<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Лава Яша — Дурак</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #087a3d;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .game {
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            margin: 5px 0;
            font-size: 25px;
        }

        .info {
            font-size: 14px;
            opacity: .9;
        }

        .table {
            position: relative;
            min-height: 390px;
            flex: 1;
        }

        .enemy {
            text-align: center;
            margin-top: 10px;
        }

        .enemy-name {
            font-weight: bold;
        }

        .enemy-cards {
            display: flex;
            justify-content: center;
            margin-top: 8px;
            height: 48px;
        }

        .enemy-card {
            width: 32px;
            height: 45px;
            background: #174a9c;
            border: 2px solid white;
            border-radius: 5px;
            margin-left: -9px;
        }

        .enemy-card:first-child {
            margin-left: 0;
        }

        .deck {
            position: absolute;
            left: 20px;
            top: 130px;
            text-align: center;
        }

        .deck-card {
            width: 55px;
            height: 78px;
            border-radius: 8px;
            background: #174a9c;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .deck-count {
            margin-top: 5px;
            font-size: 13px;
        }

        .trump {
            position: absolute;
            left: 85px;
            top: 150px;
            font-size: 18px;
        }

        .battle {
            position: absolute;
            left: 50%;
            top: 115px;
            transform: translateX(-50%);
            width: 210px;
            min-height: 150px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;

            justify-items: center;
            align-items: center;
        }

        .battle-card {
            width: 58px;
            height: 84px;

            background: white;
            color: black;

            border-radius: 8px;
            border: 2px solid #ddd;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: bold;

            box-shadow: 0 4px 8px rgba(0,0,0,.3);
        }

        .red {
            color: #d00000;
        }

        .black {
            color: #111;
        }

        .message {
            text-align: center;
            min-height: 48px;
            font-size: 15px;
            padding: 5px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        button {
            border: none;
            border-radius: 11px;
            padding: 11px 17px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .take {
            background: #e53935;
        }

        .pass {
            background: #1976d2;
        }

        .new-game {
            background: #ff9800;
            margin: 5px auto 8px;
        }

        .hand-title {
            text-align: center;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .hand {
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 5px;
            flex-wrap: wrap;
            gap: 3px;
        }

        .card {
            width: 52px;
            height: 78px;

            background: white;
            color: black;

            border-radius: 8px;
            border: 2px solid #ddd;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            font-size: 17px;
            font-weight: bold;

            box-shadow: 0 4px 8px rgba(0,0,0,.35);

            cursor: pointer;
            transition: .15s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card.disabled {
            opacity: .5;
            cursor: default;
        }

        .card.disabled:hover {
            transform: none;
        }

        @media (max-width: 390px) {
            .card {
                width: 46px;
                height: 70px;
                font-size: 15px;
            }

            .battle {
                width: 170px;
            }
        }
    </style>
</head>

<body>

<div class="game">

    <div class="header">
        <h1>🔥 Лава Яша — Дурак</h1>

        <div class="info">
            Колода: <span id="deckCount">24</span>
        </div>
    </div>

    <div class="table">

        <div class="enemy">
            <div class="enemy-name">🤖 Лава Яша</div>
            <div class="enemy-cards" id="enemyCards"></div>
        </div>

        <div class="deck">
            <div class="deck-card">🂠</div>
            <div class="deck-count" id="deckCount2">24</div>
        </div>

        <div class="trump" id="trump">
            Козырь: ♠
        </div>

        <div class="battle" id="battle"></div>

    </div>

    <div class="message" id="message">
        Загружаем игру...
    </div>

    <div class="actions">

        <button
            class="take"
            id="takeButton"
            onclick="takeCards()"
            style="display:none">
            Взять
        </button>

        <button
            class="pass"
            id="passButton"
            onclick="finishAttack()"
            style="display:none">
            Бито
        </button>

    </div>

    <div class="hand-title">
        👤 Твои карты
    </div>

    <div class="hand" id="playerHand"></div>

    <button class="new-game" onclick="newGame()">
        🔄 Новая игра
    </button>

</div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =========================
   КАРТЫ
========================= */

const suits = [
    {
        symbol: "♠",
        name: "spades",
        color: "black"
    },
    {
        symbol: "♥",
        name: "hearts",
        color: "red"
    },
    {
        symbol: "♦",
        name: "diamonds",
        color: "red"
    },
    {
        symbol: "♣",
        name: "clubs",
        color: "black"
    }
];


const ranks = [
    { name: "6", value: 6 },
    { name: "7", value: 7 },
    { name: "8", value: 8 },
    { name: "9", value: 9 },
    { name: "10", value: 10 },
    { name: "J", value: 11 },
    { name: "Q", value: 12 },
    { name: "K", value: 13 },
    { name: "A", value: 14 }
];


let deck = [];

let playerHand = [];
let enemyHand = [];

let trumpSuit = null;

let table = [];


/*
    Состояния игры:

    PLAYER_ATTACK
    PLAYER_DEFEND
    PLAYER_THROW

    ENEMY_ATTACK
    ENEMY_DEFEND

    GAME_OVER
*/

let state = "PLAYER_ATTACK";

let gameOver = false;


/* =========================
   СОЗДАНИЕ КОЛОДЫ
========================= */

function createDeck() {

    deck = [];

    for (const suit of suits) {

        for (const rank of ranks) {

            deck.push({
                suit: suit.name,
                symbol: suit.symbol,
                color: suit.color,
                rank: rank.name,
                value: rank.value
            });

        }
    }

    deck.sort(() => Math.random() - 0.5);
}


/* =========================
   НОВАЯ ИГРА
========================= */

function newGame() {

    createDeck();

    playerHand = [];
    enemyHand = [];

    table = [];

    gameOver = false;

    for (let i = 0; i < 6; i++) {

        playerHand.push(deck.pop());
        enemyHand.push(deck.pop());

    }

    trumpSuit = deck[deck.length - 1].suit;

    /*
        Для простоты первым ходишь ты.
    */

    state = "PLAYER_ATTACK";

    sortHands();

    render();

    setMessage("Твой ход. Выбери карту.");
}


/* =========================
   СОРТИРОВКА
========================= */

function sortHands() {

    const sortFunction = (a, b) => {

        if (a.suit === trumpSuit && b.suit !== trumpSuit) {
            return 1;
        }

        if (a.suit !== trumpSuit && b.suit === trumpSuit) {
            return -1;
        }

        return a.value - b.value;
    };

    playerHand.sort(sortFunction);
    enemyHand.sort(sortFunction);
}


/* =========================
   МОЖНО ЛИ ОТБИТЬ
========================= */

function canBeat(attack, defense) {

    /*
        Одна масть:
        старшая карта бьёт младшую.
    */

    if (attack.suit === defense.suit) {

        return defense.value > attack.value;
    }


    /*
        Если атака НЕ козырь,
        любой козырь её бьёт.
    */

    if (
        attack.suit !== trumpSuit &&
        defense.suit === trumpSuit
    ) {

        return true;
    }


    return false;
}


/* =========================
   МОЖНО ЛИ ПОДКИНУТЬ
========================= */

function canThrow(card) {

    if (table.length === 0) {
        return false;
    }

    /*
        Можно подкинуть только карту
        того же достоинства,
        которое уже есть на столе.
    */

    for (const pair of table) {

        if (pair.attack.rank === card.rank) {
            return true;
        }

        if (
            pair.defense &&
            pair.defense.rank === card.rank
        ) {
            return true;
        }
    }

    return false;
}


/* =========================
   КЛИК ПО КАРТЕ
========================= */

function playCard(index) {

    if (gameOver) {
        return;
    }

    const card = playerHand[index];

    if (!card) {
        return;
    }


    /* =========================
       ТЫ АТАКУЕШЬ
    ========================= */

    if (state === "PLAYER_ATTACK") {

        playerHand.splice(index, 1);

        table.push({
            attack: card,
            defense: null
        });

        state = "ENEMY_DEFEND";

        render();

        setMessage(
            "Ты пошёл " +
            card.rank +
            card.symbol +
            ". Лава Яша отбивается..."
        );

        setTimeout(enemyDefend, 700);

        return;
    }


    /* =========================
       ТЫ ПОДКИДЫВАЕШЬ
    ========================= */

    if (state === "PLAYER_THROW") {

        /*
            Все предыдущие карты должны
            быть побиты.
        */

        const unfinished = table.some(
            pair => pair.defense === null
        );

        if (unfinished) {

            setMessage("Сначала Лава Яша должен отбиться.");

            return;
        }


        /*
            Нельзя больше 6 карт за атаку
            и нельзя больше карт,
            чем у защищающегося.
        */

        if (table.length >= 6) {

            setMessage("Больше нельзя подкидывать.");

            return;
        }


        if (!canThrow(card)) {

            setMessage(
                "Можно подкинуть только карту подходящего достоинства."
            );

            return;
        }


        playerHand.splice(index, 1);

        table.push({
            attack: card,
            defense: null
        });

        state = "ENEMY_DEFEND";

        render();

        setMessage(
            "Ты подкинул " +
            card.rank +
            card.symbol +
            ". Лава Яша отбивается..."
        );

        setTimeout(enemyDefend, 700);

        return;
    }


    /* =========================
       ТЫ ЗАЩИЩАЕШЬСЯ
    ========================= */

    if (state === "PLAYER_DEFEND") {

        /*
            Находим первую карту,
            которую ещё не отбили.
        */

        const pair = table.find(
            pair => pair.defense === null
        );

        if (!pair) {
            return;
        }


        if (!canBeat(pair.attack, card)) {

            setMessage(
                "Этой картой нельзя отбиться!"
            );

            return;
        }


        playerHand.splice(index, 1);

        pair.defense = card;

        render();

        setMessage(
            "Ты отбился " +
            card.rank +
            card.symbol
        );


        /*
            Проверяем, есть ли ещё
            неотбитая карта.
        */

        const unfinished = table.some(
            pair => pair.defense === null
        );


        if (!unfinished) {

            /*
                Теперь можно либо
                ждать подкидывания ИИ,
                либо нажать БИТО.
            */

            setMessage(
                "Все карты отбиты. Лава Яша может подкинуть."
            );

            setTimeout(enemyThrow, 700);

        } else {

            setMessage("Отбей следующую карту.");
        }

        return;
    }
}


/* =========================
   ЛАВА ЯША ОТБИВАЕТСЯ
========================= */

function enemyDefend() {

    if (gameOver) {
        return;
    }

    const pair = table.find(
        pair => pair.defense === null
    );

    if (!pair) {
        return;
    }


    const possible = enemyHand.filter(
        card => canBeat(pair.attack, card)
    );


    /*
        Не может отбиться.
    */

    if (possible.length === 0) {

        setMessage(
            "Лава Яша не смог отбиться и забирает карты!"
        );

        setTimeout(enemyTake, 700);

        return;
    }


    /*
        Берём самую дешёвую подходящую карту.
    */

    possible.sort(
        (a, b) => a.value - b.value
    );


    const chosen = possible[0];

    const index = enemyHand.indexOf(chosen);

    enemyHand.splice(index, 1);

    pair.defense = chosen;

    render();

    setMessage(
        "Лава Яша отбился " +
        chosen.rank +
        chosen.symbol
    );


    /*
        Если ещё есть неотбитые карты —
        отбиваем их.
    */

    const unfinished = table.some(
        pair => pair.defense === null
    );


    if (unfinished) {

        setTimeout(enemyDefend, 700);

        return;
    }


    /*
        Всё отбито.
        Теперь Лава Яша может подкинуть.
    */

    setTimeout(enemyThrow, 700);
}


/* =========================
   ЛАВА ЯША ПОДКИДЫВАЕТ
========================= */

function enemyThrow() {

    if (gameOver) {
        return;
    }


    /*
        Если у тебя уже 6 карт на столе,
        больше нельзя.
    */

    if (table.length >= 6) {

        finishRound();

        return;
    }


    /*
        Ищем карты, которые можно подкинуть.
    */

    const possible = enemyHand.filter(
        card => canThrow(card)
    );


    /*
        Нечего подкидывать.
    */

    if (possible.length === 0) {

        finishRound();

        return;
    }


    /*
        Берём самую маленькую карту.
    */

    possible.sort(
        (a, b) => a.value - b.value
    );


    const chosen = possible[0];

    const index = enemyHand.indexOf(chosen);

    enemyHand.splice(index, 1);


    table.push({
        attack: chosen,
        defense: null
    });


    state = "PLAYER_DEFEND";

    render();

    setMessage(
        "Лава Яша подкинул " +
        chosen.rank +
        chosen.symbol +
        ". Отбивайся!"
    );
}


/* =========================
   ЛАВА ЯША ЗАБИРАЕТ
========================= */

function enemyTake() {

    for (const pair of table) {

        enemyHand.push(pair.attack);

        if (pair.defense) {
            enemyHand.push(pair.defense);
        }
    }


    table = [];

    drawCards();

    sortHands();

    checkWinner();

    if (gameOver) {
        render();
        return;
    }


    /*
        Если защищающийся забрал,
        атакующий ходит снова.
    */

    state = "PLAYER_ATTACK";

    render();

    setMessage(
        "Лава Яша забрал карты. Твой ход снова."
    );
}


/* =========================
   ТЫ ЗАБИРАЕШЬ
========================= */

function takeCards() {

    if (state !== "PLAYER_DEFEND") {
        return;
    }


    for (const pair of table) {

        playerHand.push(pair.attack);

        if (pair.defense) {
            playerHand.push(pair.defense);
        }
    }


    table = [];

    drawCards();

    sortHands();

    checkWinner();

    if (gameOver) {
        render();
        return;
    }


    /*
        После того как ты забрал,
        Лава Яша остаётся атакующим.
    */

    state = "ENEMY_ATTACK";

    render();

    setMessage(
        "Ты забрал карты. Теперь ход Лавы Яши."
    );


    setTimeout(enemyAttack, 800);
}


/* =========================
   ЛАВА ЯША НАЧИНАЕТ АТАКУ
========================= */

function enemyAttack() {

    if (gameOver) {
        return;
    }


    if (enemyHand.length === 0) {

        checkWinner();

        return;
    }


    /*
        Первая карта атаки.
    */

    const possible = [...enemyHand];

    possible.sort(
        (a, b) => a.value - b.value
    );


    const chosen = possible[0];

    const index = enemyHand.indexOf(chosen);

    enemyHand.splice(index, 1);


    table = [
        {
            attack: chosen,
            defense: null
        }
    ];


    state = "PLAYER_DEFEND";

    render();

    setMessage(
        "Лава Яша пошёл " +
        chosen.rank +
        chosen.symbol +
        ". Отбивайся!"
    );
}


/* =========================
   ВЗЯТЬ / БИТО
========================= */

function finishAttack() {

    /*
        БИТО можно нажать только
        когда ты защищаешься и
        все карты отбиты.
    */

    if (state !== "PLAYER_DEFEND") {
        return;
    }


    const unfinished = table.some(
        pair => pair.defense === null
    );


    if (unfinished) {

        setMessage(
            "Сначала отбей все карты!"
        );

        return;
    }


    /*
        Раунд закончен.
        Теперь атаковать будешь ты.
    */

    finishRound();
}


/* =========================
   ЗАВЕРШЕНИЕ РАУНДА
========================= */

function finishRound() {

    table = [];

    drawCards();

    sortHands();

    checkWinner();

    if (gameOver) {

        render();

        return;
    }


    /*
        После успешного отбоя
        атакует другой игрок.

        Если до этого атаковал Лава Яша —
        теперь атакуешь ты.

        Если атаковал ты —
        теперь атакует Лава Яша.
    */

    if (state === "PLAYER_DEFEND") {

        state = "PLAYER_ATTACK";

        render();

        setMessage(
            "Бито! Теперь твой ход."
        );

        return;
    }


    if (state === "ENEMY_DEFEND") {

        state = "ENEMY_ATTACK";

        render();

        setMessage(
            "Бито! Теперь ход Лавы Яши."
        );

        setTimeout(enemyAttack, 700);

        return;
    }
}


/* =========================
   ДОБОР КАРТ
========================= */

function drawCards() {

    /*
        Сначала добирает атакующий,
        потом защищающийся.
    */

    let first;
    let second;


    if (
        state === "PLAYER_DEFEND" ||
        state === "ENEMY_ATTACK"
    ) {

        first = enemyHand;
        second = playerHand;

    } else {

        first = playerHand;
        second = enemyHand;
    }


    while (
        first.length < 6 &&
        deck.length > 0
    ) {

        first.push(deck.pop());
    }


    while (
        second.length < 6 &&
        deck.length > 0
    ) {

        second.push(deck.pop());
    }
}


/* =========================
   ПОБЕДА
========================= */

function checkWinner() {

    if (deck.length > 0) {
        return false;
    }


    if (
        playerHand.length === 0 &&
        enemyHand.length === 0
    ) {

        gameOver = true;

        setMessage(
            "🤝 Ничья!"
        );

        return true;
    }


    if (playerHand.length === 0) {

        gameOver = true;

        setMessage(
            "🏆 Ты победил!"
        );

        return true;
    }


    if (enemyHand.length === 0) {

        gameOver = true;

        setMessage(
            "🤖 Лава Яша победил!"
        );

        return true;
    }


    return false;
}


/* =========================
   СООБЩЕНИЕ
========================= */

function setMessage(text) {

    document.getElementById("message").innerText = text;
}


/* =========================
   ОТРИСОВКА
========================= */

function render() {

    const playerElement =
        document.getElementById("playerHand");

    const enemyElement =
        document.getElementById("enemyCards");

    const battleElement =
        document.getElementById("battle");


    playerElement.innerHTML = "";
    enemyElement.innerHTML = "";
    battleElement.innerHTML = "";


    /* =========================
       КАРТЫ ИГРОКА
    ========================= */

    playerHand.forEach((card, index) => {

        const element =
            document.createElement("div");

        element.className =
            "card " + card.color;


        /*
            Определяем,
            можно ли сейчас нажимать карту.
        */

        let usable = false;


        if (
            state === "PLAYER_ATTACK" ||
            state === "PLAYER_THROW"
        ) {

            usable = true;
        }


        if (state === "PLAYER_DEFEND") {

            const pair = table.find(
                pair => pair.defense === null
            );

            if (
                pair &&
                canBeat(pair.attack, card)
            ) {

                usable = true;
            }
        }


        if (!usable) {

            element.classList.add("disabled");
        }


        element.innerHTML = `
            <div>${card.rank}</div>
            <div>${card.symbol}</div>
        `;


        if (usable) {

            element.onclick = () =>
                playCard(index);
        }


        playerElement.appendChild(element);
    });


    /* =========================
       КАРТЫ ЛАВЫ
    ========================= */

    enemyHand.forEach(() => {

        const element =
            document.createElement("div");

        element.className =
            "enemy-card";

        enemyElement.appendChild(element);
    });


    /* =========================
       СТОЛ
    ========================= */

    table.forEach(pair => {

        const attack =
            document.createElement("div");

        attack.className =
            "battle-card " +
            pair.attack.color;


        attack.innerHTML = `
            <div>${pair.attack.rank}</div>
            <div>${pair.attack.symbol}</div>
        `;


        battleElement.appendChild(attack);


        if (pair.defense) {

            const defense =
                document.createElement("div");

            defense.className =
                "battle-card " +
                pair.defense.color;


            defense.innerHTML = `
                <div>${pair.defense.rank}</div>
                <div>${pair.defense.symbol}</div>
            `;


            battleElement.appendChild(defense);

        } else {

            const empty =
                document.createElement("div");

            battleElement.appendChild(empty);
        }
    });


    /* =========================
       КОЗЫРЬ
    ========================= */

    const trump =
        suits.find(
            suit => suit.name === trumpSuit
        );


    document.getElementById("trump").innerText =
        "Козырь: " + trump.symbol;


    /* =========================
       КОЛОДА
    ========================= */

    document.getElementById("deckCount").innerText =
        deck.length;

    document.getElementById("deckCount2").innerText =
        deck.length;


    /* =========================
       КНОПКИ
    ========================= */

    const takeButton =
        document.getElementById("takeButton");

    const passButton =
        document.getElementById("passButton");


    /*
        ВЗЯТЬ видно только тому,
        кто защищается.
    */

    if (
        state === "PLAYER_DEFEND" &&
        table.length > 0
    ) {

        takeButton.style.display = "block";

    } else {

        takeButton.style.display = "none";
    }


    /*
        БИТО видно только тогда,
        когда игрок защищается
        и ВСЕ карты отбиты.
    */

    const unfinished =
        table.some(
            pair => pair.defense === null
        );


    if (
        state === "PLAYER_DEFEND" &&
        table.length > 0 &&
        !unfinished
    ) {

        passButton.style.display = "block";

    } else {

        passButton.style.display = "none";
    }
}


/* =========================
   ЗАПУСК
========================= */

newGame();

</script>

</body>
</html>
