<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Лава Яша</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: #101014;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        #game {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .top {
            text-align: center;
            margin-bottom: 8px;
        }

        .title {
            font-size: 25px;
            font-weight: 800;
        }

        .info {
            margin-top: 4px;
            color: #aaa;
            font-size: 14px;
        }

        .table {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 0;
        }

        .player-area {
            text-align: center;
        }

        .name {
            font-weight: 700;
            margin-bottom: 7px;
        }

        .cards {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;
            min-height: 105px;
        }

        .card {
            width: 58px;
            height: 82px;
            border-radius: 9px;
            background: white;
            color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 19px;
            font-weight: 700;
            box-shadow: 0 3px 10px rgba(0,0,0,.35);
            user-select: none;
            cursor: pointer;
            position: relative;
        }

        .card.red {
            color: #e53935;
        }

        .card.disabled {
            opacity: .4;
            cursor: default;
        }

        .card.back {
            background: #27272d;
            color: #777;
            cursor: default;
        }

        .table-area {
            min-height: 155px;
            margin: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .trump {
            font-size: 14px;
            color: #bbb;
            margin-bottom: 8px;
        }

        .table-cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 330px;
        }

        .pair {
            position: relative;
            width: 58px;
            height: 90px;
        }

        .pair .attack {
            position: absolute;
            top: 0;
            left: 0;
        }

        .pair .defense {
            position: absolute;
            top: 12px;
            left: 13px;
        }

        .small-card {
            width: 45px;
            height: 64px;
            font-size: 14px;
            border-radius: 7px;
        }

        .controls {
            min-height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 7px 0;
        }

        button {
            border: 0;
            border-radius: 12px;
            padding: 13px 22px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background: #303038;
            cursor: pointer;
        }

        button.primary {
            background: #ff5722;
        }

        button.green {
            background: #249b59;
        }

        button.big {
            font-size: 19px;
            padding: 16px 30px;
        }

        .status {
            text-align: center;
            min-height: 22px;
            font-size: 15px;
            color: #ddd;
        }

        .deck-info {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 3px;
        }

        /* START SCREEN */

        .start-screen {
            position: fixed;
            inset: 0;
            background: #101014;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }

        .start-screen.hidden {
            display: none;
        }

        .start-box {
            width: min(350px, 100%);
        }

        .start-logo {
            font-size: 70px;
            margin-bottom: 10px;
        }

        .start-title {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .start-subtitle {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* GAME OVER */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.78);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .overlay.show {
            display: flex;
        }

        .result {
            width: min(340px, 100%);
            background: #202027;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
        }

        .result h2 {
            margin-top: 0;
            font-size: 27px;
        }

        .result p {
            color: #bbb;
            margin-bottom: 22px;
        }

        @media (max-height: 700px) {

            .card {
                width: 50px;
                height: 72px;
            }

            .cards {
                min-height: 90px;
            }

            .table-area {
                min-height: 125px;
            }
        }

    </style>
</head>

<body>


<!-- ========================================= -->
<!-- ЭКРАН НАЧАЛА -->
<!-- ========================================= -->

<div class="start-screen" id="startScreen">

    <div class="start-box">

        <div class="start-logo">🔥</div>

        <div class="start-title">
            Лава Яша
        </div>

        <div class="start-subtitle">
            Дурак • 36 карт
        </div>

        <button
            class="primary big"
            onclick="startGame()"
        >
            🎮 Начать игру
        </button>

    </div>

</div>


<!-- ========================================= -->
<!-- ИГРА -->
<!-- ========================================= -->

<div id="game">

    <div class="top">

        <div class="title">
            🔥 Лава Яша
        </div>

        <div class="info" id="roundInfo">
            Подготовка...
        </div>

    </div>


    <div class="table">


        <!-- ЛАВА ЯША -->

        <div class="player-area">

            <div class="name">
                🔥 Лава Яша
            </div>

            <div
                class="cards"
                id="enemyCards"
            ></div>

        </div>


        <!-- СТОЛ -->

        <div class="table-area">

            <div
                class="trump"
                id="trumpInfo"
            >
                Козырь: —
            </div>

            <div
                class="table-cards"
                id="tableCards"
            ></div>

            <div
                class="deck-info"
                id="deckInfo"
            >
                Колода: —
            </div>

        </div>


        <!-- ИГРОК -->

        <div class="player-area">

            <div
                class="status"
                id="status"
            >
                Нажми «Начать игру»
            </div>


            <div
                class="controls"
                id="controls"
            ></div>


            <div class="name">
                👤 Ты
            </div>


            <div
                class="cards"
                id="playerCards"
            ></div>

        </div>

    </div>

</div>


<!-- ========================================= -->
<!-- КОНЕЦ ИГРЫ -->
<!-- ========================================= -->

<div
    class="overlay"
    id="gameOver"
>

    <div class="result">

        <h2 id="resultTitle">
            Игра окончена
        </h2>

        <p id="resultText"></p>

        <button
            class="primary"
            onclick="location.reload()"
        >
            🔄 Играть снова
        </button>

    </div>

</div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


// ============================================
// КАРТЫ
// ============================================

const suits = [

    {
        symbol: "♠",
        name: "spades",
        red: false
    },

    {
        symbol: "♥",
        name: "hearts",
        red: true
    },

    {
        symbol: "♦",
        name: "diamonds",
        red: true
    },

    {
        symbol: "♣",
        name: "clubs",
        red: false
    }

];


const ranks = [

    {
        name: "6",
        value: 6
    },

    {
        name: "7",
        value: 7
    },

    {
        name: "8",
        value: 8
    },

    {
        name: "9",
        value: 9
    },

    {
        name: "10",
        value: 10
    },

    {
        name: "J",
        value: 11
    },

    {
        name: "Q",
        value: 12
    },

    {
        name: "K",
        value: 13
    },

    {
        name: "A",
        value: 14
    }

];


// ============================================
// СОСТОЯНИЕ
// ============================================

let deck = [];

let trumpSuit = null;

let playerHand = [];

let enemyHand = [];

let table = [];

let attacker = null;

let defender = null;

let phase = "attack";

let maxTableCards = 6;

let firstRound = true;

let deckFinished = false;

let gameOver = false;

let gameStarted = false;


// ============================================
// СОЗДАНИЕ КОЛОДЫ
// ============================================

function createDeck() {

    const cards = [];

    for (const suit of suits) {

        for (const rank of ranks) {

            cards.push({

                id: `${suit.name}_${rank.name}`,

                suit: suit.name,

                symbol: suit.symbol,

                red: suit.red,

                rank: rank.name,

                value: rank.value

            });

        }

    }

    return cards;
}


// ============================================
// ПЕРЕМЕШИВАНИЕ
// ============================================

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [array[i], array[j]] =
            [array[j], array[i]];

    }

    return array;
}


// ============================================
// НАЧАЛО ИГРЫ
// ============================================

function startGame() {

    if (gameStarted) {
        return;
    }

    gameStarted = true;

    document
        .getElementById("startScreen")
        .classList.add("hidden");


    deck = shuffle(createDeck());

    playerHand =
        deck.splice(0, 6);

    enemyHand =
        deck.splice(0, 6);


    // Открываем козырь

    const trumpCard =
        deck.pop();

    trumpSuit =
        trumpCard.suit;


    // Козырь лежит под колодой

    deck.unshift(trumpCard);


    determineFirstAttacker();

    render();

    startTurn();
}


// ============================================
// ПЕРВЫЙ АТАКУЮЩИЙ
// ============================================

function determineFirstAttacker() {

    const playerTrump =
        playerHand
            .filter(card =>
                card.suit === trumpSuit
            )
            .sort(
                (a, b) =>
                    a.value - b.value
            );


    const enemyTrump =
        enemyHand
            .filter(card =>
                card.suit === trumpSuit
            )
            .sort(
                (a, b) =>
                    a.value - b.value
            );


    // Если козырей нет вообще
    // — пересдаём

    if (
        playerTrump.length === 0 &&
        enemyTrump.length === 0
    ) {

        deck = shuffle(createDeck());

        playerHand =
            deck.splice(0, 6);

        enemyHand =
            deck.splice(0, 6);

        const trumpCard =
            deck.pop();

        trumpSuit =
            trumpCard.suit;

        deck.unshift(trumpCard);

        determineFirstAttacker();

        return;
    }


    if (playerTrump.length === 0) {

        attacker = "enemy";

        defender = "player";

    }

    else if (enemyTrump.length === 0) {

        attacker = "player";

        defender = "enemy";

    }

    else {

        if (
            playerTrump[0].value <
            enemyTrump[0].value
        ) {

            attacker = "player";

            defender = "enemy";

        }

        else {

            attacker = "enemy";

            defender = "player";

        }

    }

}


// ============================================
// НАЧАЛО КОНА
// ============================================

function startTurn() {

    if (gameOver) {
        return;
    }


    table = [];


    const defenderCards =
        defender === "player"
            ? playerHand.length
            : enemyHand.length;


    maxTableCards =
        Math.min(
            6,
            defenderCards
        );


    // В первом кону максимум 5

    if (firstRound) {

        maxTableCards =
            Math.min(
                5,
                maxTableCards
            );

    }


    phase = "attack";

    render();


    if (attacker === "enemy") {

        updateStatus(
            "Лава Яша думает..."
        );

        setTimeout(
            enemyAttack,
            700
        );

    }

    else {

        updateStatus(
            "Твой ход — выбери карту для атаки."
        );

    }

}


// ============================================
// КОЗЫРЬ
// ============================================

function isTrump(card) {

    return card.suit === trumpSuit;

}


// ============================================
// МОЖЕТ ЛИ ПОБИТЬ
// ============================================

function canBeat(
    attackCard,
    defenseCard
) {

    // Козырь против козыря

    if (
        isTrump(attackCard) &&
        isTrump(defenseCard)
    ) {

        return (
            defenseCard.value >
            attackCard.value
        );

    }


    // Некозырь против некозыря

    if (
        !isTrump(attackCard) &&
        !isTrump(defenseCard)
    ) {

        return (

            attackCard.suit ===
            defenseCard.suit

            &&

            defenseCard.value >
            attackCard.value

        );

    }


    // Козырь бьёт обычную карту

    if (
        !isTrump(attackCard) &&
        isTrump(defenseCard)
    ) {

        return true;

    }


    return false;
}


// ============================================
// НОМИНАЛЫ НА СТОЛЕ
// ============================================

function tableRanks() {

    const result = [];

    for (const pair of table) {

        result.push(
            pair.attack.rank
        );


        if (pair.defense) {

            result.push(
                pair.defense.rank
            );

        }

    }

    return result;
}


// ============================================
// МОЖНО ЛИ ПОДКИНУТЬ
// ============================================

function canThrow(card) {

    if (
        table.length >=
        maxTableCards
    ) {

        return false;

    }


    return tableRanks()
        .includes(card.rank);

}


// ============================================
// ХОД ИГРОКА
// ============================================

function playPlayerCard(index) {

    if (gameOver) {
        return;
    }


    const card =
        playerHand[index];


    if (!card) {
        return;
    }


    // ========================================
    // АТАКА
    // ========================================

    if (
        phase === "attack" &&
        attacker === "player"
    ) {

        playerHand.splice(
            index,
            1
        );


        table.push({

            attack: card,

            defense: null

        });


        phase = "defend";


        render();


        setTimeout(
            enemyDefend,
            650
        );


        return;
    }


    // ========================================
    // ЗАЩИТА
    // ========================================

    if (
        phase === "defend" &&
        defender === "player"
    ) {

        const pair =
            table.find(
                pair => !pair.defense
            );


        if (!pair) {
            return;
        }


        if (
            !canBeat(
                pair.attack,
                card
            )
        ) {

            updateStatus(
                "❌ Этой картой нельзя побить."
            );

            return;
        }


        playerHand.splice(
            index,
            1
        );


        pair.defense =
            card;


        render();


        // Все карты отбиты

        if (
            allCardsDefended()
        ) {

            phase = "throw";

            render();

            updateStatus(
                "Отбился. Можешь подкинуть или нажать «Бито»."
            );

        }

        return;
    }


    // ========================================
    // ПОДКИДЫВАНИЕ
    // ========================================

    if (
        phase === "throw" &&
        attacker === "player"
    ) {

        if (
            !canThrow(card)
        ) {

            updateStatus(
                "❌ Можно подкинуть только карту такого же достоинства."
            );

            return;
        }


        playerHand.splice(
            index,
            1
        );


        table.push({

            attack: card,

            defense: null

        });


        phase = "defend";


        render();


        setTimeout(
            enemyDefend,
            650
        );


        return;
    }

}


// ============================================
// ВСЕ КАРТЫ ОТБИТЫ?
// ============================================

function allCardsDefended() {

    return (

        table.length > 0

        &&

        table.every(
            pair =>
                pair.defense !== null
        )

    );

}


// ============================================
// ВЗЯТЬ
// ============================================

function takeCards() {

    if (
        phase !== "defend" ||
        defender !== "player"
    ) {

        return;
    }


    for (
        const pair of table
    ) {

        playerHand.push(
            pair.attack
        );


        if (pair.defense) {

            playerHand.push(
                pair.defense
            );

        }

    }


    table = [];


    // Игрок забрал —
    // он пропускает следующий ход.

    attacker = "enemy";

    defender = "player";


    firstRound = false;


    drawCards();


    render();


    checkEndAfterRound();


    if (!gameOver) {

        setTimeout(
            startTurn,
            700
        );

    }

}


// ============================================
// БИТО
// ============================================

function finishRound() {

    if (gameOver) {
        return;
    }


    if (
        !allCardsDefended()
    ) {

        updateStatus(
            "Сначала нужно отбиться от всех карт."
        );

        return;
    }


    table = [];


    // ВАЖНО:
    // отбившийся становится атакующим.

    const oldDefender =
        defender;


    attacker =
        oldDefender;


    defender =
        oldDefender === "player"
            ? "enemy"
            : "player";


    firstRound = false;


    drawCards();


    checkEndAfterRound();


    if (!gameOver) {

        setTimeout(
            startTurn,
            700
        );

    }

}


// ============================================
// ДОБОР
// ============================================

function drawCards() {

    if (
        deck.length === 0
    ) {

        deckFinished = true;

        return;
    }


    // Сначала атакующий

    drawFor(attacker);


    // Потом защищающийся

    drawFor(defender);


    if (
        deck.length === 0
    ) {

        deckFinished = true;

    }

}


// ============================================
// ДОБОР КОНКРЕТНОГО ИГРОКА
// ============================================

function drawFor(who) {

    const hand =
        who === "player"
            ? playerHand
            : enemyHand;


    while (
        hand.length < 6 &&
        deck.length > 0
    ) {

        hand.push(
            deck.shift()
        );

    }

}


// ============================================
// АТАКА ЛАВЫ ЯШИ
// ============================================

function enemyAttack() {

    if (gameOver) {
        return;
    }


    if (
        enemyHand.length === 0
    ) {

        checkEndAfterRound();

        return;
    }


    const sorted =
        [...enemyHand]
            .sort(
                (a, b) => {

                    if (
                        isTrump(a) !==
                        isTrump(b)
                    ) {

                        return isTrump(a)
                            ? 1
                            : -1;

                    }


                    return (
                        a.value -
                        b.value
                    );

                }
            );


    const card =
        sorted[0];


    const index =
        enemyHand.indexOf(card);


    enemyHand.splice(
        index,
        1
    );


    table.push({

        attack: card,

        defense: null

    });


    phase = "defend";


    render();


    updateStatus(
        "Лава Яша атакует. Защищайся."
    );

}


// ============================================
// ЗАЩИТА ЛАВЫ ЯШИ
// ============================================

function enemyDefend() {

    if (gameOver) {
        return;
    }


    const pair =
        table.find(
            pair => !pair.defense
        );


    if (!pair) {
        return;
    }


    const possible =
        enemyHand
            .filter(
                card =>
                    canBeat(
                        pair.attack,
                        card
                    )
            )
            .sort(
                (a, b) => {

                    if (
                        isTrump(a) !==
                        isTrump(b)
                    ) {

                        return isTrump(a)
                            ? 1
                            : -1;

                    }


                    return (
                        a.value -
                        b.value
                    );

                }
            );


    // Не смог отбиться

    if (
        possible.length === 0
    ) {

        enemyTake();

        return;
    }


    // Берём самую дешёвую
    // подходящую карту

    const card =
        possible[0];


    const index =
        enemyHand.indexOf(card);


    enemyHand.splice(
        index,
        1
    );


    pair.defense =
        card;


    render();


    // Если осталось что отбивать

    if (
        !allCardsDefended()
    ) {

        setTimeout(
            enemyDefend,
            650
        );

        return;
    }


    /*
        ВАЖНО:

        Лава Яша только что отбилась.

        Он НЕ подкидывает.

        Теперь атакующий снова получает
        право решить, подкидывать или
        закончить кон.

        В нашей игре атакующий здесь —
        игрок.
    */

    phase = "throw";


    render();


    updateStatus(
        "Лава Яша отбился. Подкинь карту или нажми «Бито»."
    );

}


// ============================================
// ЛАВА ЯША ЗАБИРАЕТ
// ============================================

function enemyTake() {

    for (
        const pair of table
    ) {

        enemyHand.push(
            pair.attack
        );


        if (pair.defense) {

            enemyHand.push(
                pair.defense
            );

        }

    }


    table = [];


    // Лава Яша забрал.

    // Поэтому он пропускает следующий ход.
    // Ты остаёшься атакующим.

    attacker = "player";

    defender = "enemy";


    firstRound = false;


    drawCards();


    render();


    checkEndAfterRound();


    if (!gameOver) {

        setTimeout(
            startTurn,
            700
        );

    }

}


// ============================================
// КНОПКИ
// ============================================

function renderControls() {

    const controls =
        document.getElementById(
            "controls"
        );


    controls.innerHTML = "";


    // Защита игрока

    if (
        phase === "defend" &&
        defender === "player"
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "primary";


        button.textContent =
            "🙌 Взять";


        button.onclick =
            takeCards;


        controls.appendChild(
            button
        );


        return;
    }


    // Бито

    if (
        phase === "throw" &&
        attacker === "player" &&
        allCardsDefended()
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "green";


        button.textContent =
            "✅ Бито";


        button.onclick =
            finishRound;


        controls.appendChild(
            button
        );


        return;
    }

}


// ============================================
// СТАТУС
// ============================================

function updateStatus(text) {

    document.getElementById(
        "status"
    ).textContent = text;

}


// ============================================
// ОТОБРАЖЕНИЕ
// ============================================

function render() {

    renderEnemyCards();

    renderPlayerCards();

    renderTable();

    renderControls();


    document.getElementById(
        "deckInfo"
    ).textContent =

        deckFinished

            ? "Колода закончилась"

            : `Колода: ${deck.length}`;


    document.getElementById(
        "trumpInfo"
    ).textContent =

        `Козырь: ${getSuitSymbol(trumpSuit)}`;


    document.getElementById(
        "roundInfo"
    ).textContent =

        `У тебя: ${playerHand.length} • У Лавы Яши: ${enemyHand.length}`;

}


// ============================================
// КАРТЫ ЛАВЫ ЯШИ
// ============================================

function renderEnemyCards() {

    const container =
        document.getElementById(
            "enemyCards"
        );


    container.innerHTML = "";


    for (
        let i = 0;
        i < enemyHand.length;
        i++
    ) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card back";


        card.textContent =
            "🔥";


        container.appendChild(
            card
        );

    }

}


// ============================================
// КАРТЫ ИГРОКА
// ============================================

function renderPlayerCards() {

    const container =
        document.getElementById(
            "playerCards"
        );


    container.innerHTML = "";


    playerHand.forEach(
        (card, index) => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "card" +
                (
                    card.red
                        ? " red"
                        : ""
                );


            element.innerHTML = `

                <div>
                    ${card.rank}
                </div>

                <div>
                    ${card.symbol}
                </div>

            `;


            let disabled = false;


            // Защита

            if (
                phase === "defend" &&
                defender === "player"
            ) {

                const pair =
                    table.find(
                        pair =>
                            !pair.defense
                    );


                if (
                    !pair ||
                    !canBeat(
                        pair.attack,
                        card
                    )
                ) {

                    disabled = true;

                }

            }


            // Подкидывание

            if (
                phase === "throw" &&
                attacker === "player"
            ) {

                if (
                    !canThrow(card)
                ) {

                    disabled = true;

                }

            }


            // Не наше действие

            if (
                phase !== "attack" &&
                phase !== "defend" &&
                phase !== "throw"
            ) {

                disabled = true;

            }


            // Атака

            if (
                phase === "attack" &&
                attacker === "player"
            ) {

                disabled = false;

            }


            if (disabled) {

                element.classList.add(
                    "disabled"
                );

            }

            else {

                element.onclick =
                    () =>
                        playPlayerCard(
                            index
                        );

            }


            container.appendChild(
                element
            );

        }
    );

}


// ============================================
// СТОЛ
// ============================================

function renderTable() {

    const container =
        document.getElementById(
            "tableCards"
        );


    container.innerHTML = "";


    table.forEach(
        pair => {

            const pairElement =
                document.createElement(
                    "div"
                );


            pairElement.className =
                "pair";


            const attack =
                createSmallCard(
                    pair.attack
                );


            attack.classList.add(
                "attack"
            );


            pairElement.appendChild(
                attack
            );


            if (
                pair.defense
            ) {

                const defense =
                    createSmallCard(
                        pair.defense
                    );


                defense.classList.add(
                    "defense"
                );


                pairElement.appendChild(
                    defense
                );

            }


            container.appendChild(
                pairElement
            );

        }
    );

}


// ============================================
// МАЛЕНЬКАЯ КАРТА
// ============================================

function createSmallCard(card) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "card small-card" +
        (
            card.red
                ? " red"
                : ""
        );


    element.innerHTML = `

        <div>
            ${card.rank}
        </div>

        <div>
            ${card.symbol}
        </div>

    `;


    return element;

}


// ============================================
// СИМВОЛ МАСТИ
// ============================================

function getSuitSymbol(suit) {

    const found =
        suits.find(
            s =>
                s.name === suit
        );


    return found
        ? found.symbol
        : "—";

}


// ============================================
// ПРОВЕРКА КОНЦА ИГРЫ
// ============================================

function checkEndAfterRound() {

    if (!deckFinished) {
        return;
    }


    const playerEmpty =
        playerHand.length === 0;


    const enemyEmpty =
        enemyHand.length === 0;


    // Оба закончили одновременно

    if (
        playerEmpty &&
        enemyEmpty
    ) {

        endGame(
            "🤝 Ничья!",
            "Вы одновременно избавились от всех карт."
        );

        return;
    }


    if (playerEmpty) {

        endGame(
            "🏆 Ты победил!",
            "Ты первым избавился от всех карт."
        );

        return;
    }


    if (enemyEmpty) {

        endGame(
            "🏆 Ты победил!",
            "Лава Яша первым остался без карт."
        );

        return;
    }

}


// ============================================
// КОНЕЦ ИГРЫ
// ============================================

function endGame(
    title,
    text
) {

    gameOver = true;


    document.getElementById(
        "resultTitle"
    ).textContent = title;


    document.getElementById(
        "resultText"
    ).textContent = text;


    document.getElementById(
        "gameOver"
    ).classList.add(
        "show"
    );

}

</script>

</body>
</html>
